name: Windows build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build portable self-contained package
        shell: pwsh
        run: ./scripts/build.ps1 -SelfContained

      - uses: actions/upload-artifact@v7
        with:
          name: StructureEditor-win-x64
          path: dist/*-standalone.zip
          if-no-files-found: error

      # Keep a small .NET Desktop Runtime dependent app/ tracked in Git.
      # This makes a normal GitHub Desktop Pull update StructureEditor.exe.
      - name: Build application files for Git pull
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke-test editor startup (WinForms tab hosts)
        shell: pwsh
        run: |
          dotnet ./app/StructureEditor.dll --ui-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "WinForms startup smoke test failed." }

      - name: Verify warm catalog cache, invalidation, and lazy ZIP indexing
        shell: pwsh
        run: |
          dotnet ./app/StructureEditor.dll --catalog-cache-test
          if ($LASTEXITCODE -ne 0) { throw "Catalog cache regression check failed." }

      - name: Commit app files to main and legacy default branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- app/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "build: sync StructureEditor app files [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "Failed to commit app output" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Failed to update main with app output" }
            # The repository still has codex/structure-editor as its web default.
            # Fast-forward it only; never force-reset active work.
            git fetch origin codex/structure-editor
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch legacy branch" }
            git push origin HEAD:codex/structure-editor
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Legacy branch did not fast-forward; switch GitHub Desktop to main."
              $global:LASTEXITCODE = 0
            }
          }
          elseif ($LASTEXITCODE -ne 0) {
            throw "Cannot check staged app changes"
          }
