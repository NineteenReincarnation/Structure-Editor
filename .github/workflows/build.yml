name: Windows build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Verify module directory boundaries
        shell: pwsh
        run: ./scripts/check-architecture.ps1

      # Build only the app/ files tracked in Git; no release archives.
      - name: Publish app files
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Smoke-test bundled executable (WinForms/WPF)
        shell: pwsh
        run: |
          $run = Start-Process -FilePath "./app/StructureEditor.exe" -ArgumentList "--ui-smoke-test" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Single-file editor startup smoke test failed (exit $($run.ExitCode))." }

      - name: Verify warm catalog cache and lazy asset indexing
        shell: pwsh
        run: |
          $run = Start-Process -FilePath "./app/StructureEditor.exe" -ArgumentList "--catalog-cache-test" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Single-file catalog cache check failed (exit $($run.ExitCode))." }

      # Only main is updated. All other branches remain untouched for
      # the repository owner to delete manually.
      - name: Commit app output to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- app/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "build: sync StructureEditor app files [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw "Failed to commit app output" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Failed to update main" }
          }
          elseif ($LASTEXITCODE -ne 0) {
            throw "Cannot inspect staged app changes"
          }
