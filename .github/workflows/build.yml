name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build.ps1 -SelfContained
      - uses: actions/upload-artifact@v7
        with:
          name: StructureEditor-win-x64
          path: dist/*.zip
          if-no-files-found: error
